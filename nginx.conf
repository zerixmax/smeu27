server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Kompresija ----------------------------------------------------------
    # Tekstualni tipovi samo; woff2/webp/jpg su već komprimirani (gzip ih ne znači).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/csv application/json application/javascript application/rss+xml application/atom+xml application/manifest+json image/svg+xml;

    # --- Sigurnosna zaglavlja (server razina) ---------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Asseti s dugotrajnim keširanjem ---------------------------------------
    # NAPOMENA: add_header u location NE nasljeđuje zaglavlja iz server razine,
    # pa se ispod svaki put ponavlja minimum sigurnosnih zaglavlja.

    # Hashirani Astro asseti (JS/CSS/webp) — content hash je u imenu datoteke,
    # pa je "immutable" ispravno i sigurno na 1 godinu.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Fontovi: imena datoteka NIJU hash-ana (Inter-var-latin.woff2), pa "immutable"
    # na 1 godinu bi zaključao korisnike na zastarjeli font nakon ispravka.
    # Zato 7 dana + must-revalidate; nakon uvođenja hasha u imenu -> 1y immutable.
    location /fonts/ {
        add_header Cache-Control "public, max-age=604800, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # CSV cjenik s UTF-8 charsetom (propisani HOK format)
    location ~* \.csv$ {
        add_header Content-Type "text/csv; charset=utf-8" always;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML dokumenti — uvijek se provjeravaju s poslužiteljem (bez stale sadržaja)
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # --- Prilagođene error stranice -------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
        internal;
    }
}
