server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip kompresija
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml text/csv;

    # Sigurnosna zaglavlja
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Statički Astro asseti s dugotrajnim keširanjem (1 godina, immutable)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # CSV cjenik s UTF-8 charsetom
    location ~* \.csv$ {
        add_header Content-Type "text/csv; charset=utf-8";
        add_header Cache-Control "public, max-age=3600";
    }

    # Rutiranje stranica (SPA/SSG fallback)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Prilagođene error stranice
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
        internal;
    }
}
